appId: dev.zurichscud.skillsdeck
productName: Skills Deck
copyright: Copyright © 2026 zurichscud

directories:
  output: release/${version}

files:
  - out/**/*
  - package.json

asar: true
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  darkModeSupport: true

win:
  target:
    - nsis

nsis:
  oneClick: true
  deleteAppDataOnUninstall: true

linux:
  category: Development
  target:
    - AppImage
    - deb
